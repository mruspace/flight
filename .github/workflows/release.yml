name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  version:
    name: tag matches Cargo.toml and CITATION.cff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          cff=$(sed -n 's/^version: //p' CITATION.cff)
          echo "tag $tag, Cargo.toml $cargo, CITATION.cff $cff"
          if [ "$tag" != "$cargo" ] || [ "$tag" != "$cff" ]; then
            echo "::error::Tag v$tag does not match Cargo.toml ($cargo) and CITATION.cff ($cff). Bump the version, then tag that commit."
            exit 1
          fi

  build:
    needs: version
    name: build (${{ matrix.target }})
    strategy:
      matrix:
        target:
          - aarch64-unknown-linux-musl # 64-bit ARM
          - armv7-unknown-linux-musleabihf # 32-bit ARM, hard float
          - armv7-unknown-linux-musleabi # 32-bit ARM, soft float
          - x86_64-unknown-linux-musl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cross --locked
      - run: cross build -p demo -p bench --release --target ${{ matrix.target }}
      - name: Package binaries, launcher, fault schedule and operations note
        run: |
          name=quorum-${{ github.ref_name }}-${{ matrix.target }}
          mkdir -p "pkg/$name" dist
          cp target/${{ matrix.target }}/release/quorum target/${{ matrix.target }}/release/bench "pkg/$name/"
          cp opssat/run.sh opssat/run opssat/faults.example.txt opssat/faults.5min.txt "pkg/$name/"
          cp docs/opssat.md "pkg/$name/OPSSAT.md"
          cp LICENSE "pkg/$name/"
          tar -C pkg -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  fprime:
    needs: version
    name: build (F´ deployment, armv7-linux-static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build the deployment and compile its sequences in the build container
        run: ./opssat/fprime/build.sh
      - name: Package the deployment, sequences, entry script and sources
        run: |
          name=mru-fprime-${{ github.ref_name }}-armv7-linux-static
          mkdir -p "pkg/$name" dist
          cp opssat/fprime/dist/* "pkg/$name/"
          cp opssat/fprime/run opssat/fprime/shrink.seq opssat/fprime/tmr.seq opssat/fprime/restart.seq LICENSE "pkg/$name/"
          tar -C pkg -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: fprime-armv7-linux-static
          path: dist/*

  release:
    needs: [build, fprime]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum quorum-* mru-fprime-* > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
