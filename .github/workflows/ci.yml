name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Unit tests
        run: cargo test --workspace --release
      - name: Scenario tests
        run: ./scripts/scenarios.sh
      - name: Demo and footprint
        run: |
          uname -sm
          ls -l target/release/quorum
          for p in tmr shrink; do
            target/release/quorum --policy "$p" --ticks 20000 --seed 1 --upset-rate 0.001 \
              --fault stuck:1@4000 --fault kill:0@9000
          done

  no-std:
    name: no_std build (bare-metal ARM Cortex-M)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - run: cargo build -p quorum --release --target thumbv7em-none-eabihf

  kani:
    name: Kani proofs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: model-checking/kani-github-action@v1
        with:
          args: -p quorum

  static-arm:
    name: static ARM binary (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-musl
            platform: linux/arm64
          - target: armv7-unknown-linux-musleabihf
            platform: linux/arm/v7
          - target: armv7-unknown-linux-musleabi
            platform: linux/arm/v7
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cross
        run: cargo install cross --locked
      - name: Build a fully static binary
        run: cross build -p demo --release --target ${{ matrix.target }}
      - uses: docker/setup-qemu-action@v3
      - name: Scenario tests on ${{ matrix.platform }} (emulated)
        run: |
          bin=target/${{ matrix.target }}/release/quorum
          file "$bin"
          ls -l "$bin"
          docker run --rm --platform ${{ matrix.platform }} -v "$PWD:/w" -w /w \
            -e QUORUM_BIN="$bin" -e QUORUM_EMULATED=1 alpine:3 \
            sh -c 'uname -m && ./scripts/scenarios.sh'
      - uses: actions/upload-artifact@v4
        with:
          name: quorum-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/quorum
