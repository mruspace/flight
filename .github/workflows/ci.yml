name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Unit tests
        run: cargo test --workspace --release
      - name: Scenario tests
        run: ./scripts/scenarios.sh
      - name: C interface (quorum.h against the static library)
        run: ./quorum-ffi/tests/c.sh
      - name: Demo and footprint
        run: |
          uname -sm
          ls -l target/release/quorum
          for p in tmr shrink; do
            target/release/quorum --policy "$p" --ticks 20000 --seed 1 --upset-rate 0.001 \
              --fault stuck:1@4000 --fault kill:0@9000
          done

  bench:
    name: bench (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
          components: llvm-tools
      - name: Full bench matrix
        run: ./scripts/bench.sh
      - name: KAT coverage (quick sample)
        run: ./scripts/kat-coverage.sh --quick
      - uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.os }}
          path: bench/results/

  fprime:
    name: F´ components (build, unit tests, parity with the demo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the F´ tools (pinned by the submodule, v4.4.1)
        run: pip install -r fprime/requirements.txt
      - name: Expected counts are the demo's
        run: ./scripts/parity-cases.sh --check
      - name: Build the components and the MruOpsSat deployment
        working-directory: fprime
        run: fprime-util generate && fprime-util build -j4
      - name: Deployment end to end (OPS-SAT run 3 package, counts against the demo)
        run: ./scripts/fprime-deployment.sh
      - name: Deployment end to end, version 2 (replicas as processes, a real kill)
        run: VERSION=2 ./scripts/fprime-deployment.sh
      - name: Unit tests and parity with the demo (MRU-SYS-001)
        working-directory: fprime
        run: fprime-util generate --ut && fprime-util check --all -j4

  no-std:
    name: no_std build (bare-metal ARM Cortex-M)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - run: cargo build -p quorum --release --target thumbv7em-none-eabihf

  claims:
    name: README numbers match the results files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-claims.sh

  kani:
    name: Kani proofs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: model-checking/kani-github-action@v1
        with:
          args: -p quorum -p quorum-ffi

  static-arm:
    # ARM jobs keep the names the main-branch ruleset requires
    name: ${{ startsWith(matrix.target, 'x86_64') && 'static binary' || 'static ARM binary' }} (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-musl
            platform: linux/arm64
          - target: armv7-unknown-linux-musleabihf
            platform: linux/arm/v7
          - target: armv7-unknown-linux-musleabi
            platform: linux/arm/v7
          - target: x86_64-unknown-linux-musl
            platform: linux/amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cross
        run: cargo install cross --locked
      - name: Build a fully static binary
        run: cross build -p demo -p bench --release --target ${{ matrix.target }}
      - uses: docker/setup-qemu-action@v3
      - name: Scenario tests in a ${{ matrix.platform }} container
        run: |
          bin=target/${{ matrix.target }}/release/quorum
          file "$bin"
          ls -l "$bin"
          docker run --rm --platform ${{ matrix.platform }} -v "$PWD:/w" -w /w \
            -e QUORUM_BIN="$bin" -e QUORUM_EMULATED=1 alpine:3 \
            sh -c 'uname -m && ./scripts/scenarios.sh'
      - name: Bench counts under emulation match a native run
        run: |
          BENCH_OUT=native ./scripts/bench.sh --quick
          docker run --rm --platform ${{ matrix.platform }} -v "$PWD:/w" -w /w \
            -e QUORUM_BIN=target/${{ matrix.target }}/release/quorum -e BENCH_OUT=emulated alpine:3 \
            ./scripts/bench.sh --quick
          cut -d, -f1-17 native/*.csv >native.txt
          cut -d, -f1-17 emulated/*.csv >emulated.txt
          cmp native.txt emulated.txt && echo "same results on ${{ matrix.platform }} as native"
      - name: KAT coverage counts under emulation match a native run
        run: |
          BENCH_OUT=native-kat ./scripts/kat-coverage.sh --quick
          docker run --rm --platform ${{ matrix.platform }} -v "$PWD:/w" -w /w \
            -e QUORUM_BIN=target/${{ matrix.target }}/release/quorum -e BENCH_OUT=emulated-kat alpine:3 \
            ./scripts/kat-coverage.sh --quick
          # columns 1-17: everything before the timing columns (cpu_s, wall_s)
          cut -d, -f1-17 native-kat/*.csv >native-kat.txt
          cut -d, -f1-17 emulated-kat/*.csv >emulated-kat.txt
          cmp native-kat.txt emulated-kat.txt && echo "same KAT coverage on ${{ matrix.platform }} as native"
      - uses: actions/upload-artifact@v4
        with:
          name: quorum-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/quorum
            target/${{ matrix.target }}/release/bench
