[workspace]
members = ["quorum", "quorum-ffi", "demo", "bench"]
# F´ (fprime/lib/fprime) has Rust crates of its own, outside this workspace
exclude = ["fprime"]
resolver = "2"

[workspace.package]
version = "0.3.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/mruspace/flight"
homepage = "https://mru.space"

[profile.release]
lto = true
codegen-units = 1
